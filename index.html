<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APMIF João e Maria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg1:#efe1fb; --bg2:#fbdcec; --blob1:#d9b8f5; --blob2:#f8b4d4; --blob3:#e9c9fa;
  --ink:#3b1d5e; --ink-soft:#6a4a8c; --card:rgba(255,255,255,.88); --card-hover:#fff;
  --ring:#7b3fc4; --shadow:rgba(90,40,140,.18);
  --pink:#e6188d; --blue:#1f5fbf; --green:#0f8a4f; --purple:#8a3fd1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#24103d; --bg2:#3a1237; --blob1:#4a2380; --blob2:#7a1f5c; --blob3:#3a1c63;
    --ink:#f6e9ff; --ink-soft:#d3b8ee; --card:rgba(255,255,255,.1); --card-hover:rgba(255,255,255,.18);
    --ring:#f0a6d6; --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#24103d; --bg2:#3a1237; --blob1:#4a2380; --blob2:#7a1f5c; --blob3:#3a1c63;
  --ink:#f6e9ff; --ink-soft:#d3b8ee; --card:rgba(255,255,255,.1); --card-hover:rgba(255,255,255,.18);
  --ring:#f0a6d6; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  position:relative; overflow-x:hidden;
}
.blobs{position:fixed; inset:0; z-index:0; pointer-events:none}
.blobs svg{width:100%; height:100%}
main{
  position:relative; z-index:1;
  max-width:480px; margin:0 auto;
  padding:40px 20px 36px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
}
.logo{
  width:168px; height:168px; border-radius:50%;
  background:#fff; padding:6px;
  box-shadow:0 0 0 6px rgba(255,255,255,.55), 0 14px 32px var(--shadow);
  overflow:hidden;
}
.logo img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block}
h1{
  font-family:"Baloo 2","Nunito","Trebuchet MS",sans-serif;
  font-weight:700; font-size:1.5rem; line-height:1.2;
  margin:22px 0 6px; max-width:22ch; text-wrap:balance;
}
.tag{
  font-family:"Baloo 2","Nunito",sans-serif; font-weight:500;
  font-size:1.15rem; margin:0 0 28px; color:var(--pink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#ff8ccb}}
:root[data-theme="dark"] .tag{color:#ff8ccb}
.links{list-style:none; margin:0; padding:0; width:100%; display:flex; flex-direction:column; gap:14px}
.links a{
  display:flex; align-items:center; gap:14px;
  min-height:64px; padding:10px 22px 10px 12px;
  background:var(--card); color:var(--ink);
  border-radius:999px; text-decoration:none;
  font-family:"Baloo 2","Nunito",sans-serif; font-weight:700; font-size:1.15rem;
  box-shadow:0 6px 18px var(--shadow);
  backdrop-filter:blur(6px);
  transition:transform .15s ease, background .15s ease;
}
.links a:hover{background:var(--card-hover); transform:translateY(-2px)}
.links a:focus-visible{outline:3px solid var(--ring); outline-offset:3px}
.ico{
  flex:none; width:44px; height:44px; border-radius:50%;
  display:grid; place-items:center; color:#fff;
}
.ico svg{width:24px; height:24px; fill:currentColor}
.label{flex:1; text-align:left}
.label small{display:block; font-family:"Nunito",sans-serif; font-weight:600; font-size:.8rem; color:var(--ink-soft); margin-top:-4px}
.i-bot{background:linear-gradient(135deg,var(--pink),var(--purple))} .i-ig{background:var(--pink)} .i-fb{background:var(--blue)} .i-map{background:var(--green)} .i-web{background:var(--purple)}
footer{margin-top:40px; font-size:.78rem; color:var(--ink-soft); font-weight:600; opacity:.75}
@media (max-width:420px){
  main{padding:28px 16px 24px}
  .logo{width:140px; height:140px}
  h1{font-size:1.25rem; margin-top:18px}
  .tag{font-size:1.05rem; margin-bottom:22px}
  .links{gap:12px}
  .links a{min-height:58px; padding:8px 18px 8px 10px; gap:12px; font-size:1.05rem}
  .ico{width:40px; height:40px}
  .ico svg{width:22px; height:22px}
  footer{margin-top:32px}
}
@media (max-width:340px){
  .logo{width:120px; height:120px}
  h1{font-size:1.1rem}
  .links a{font-size:1rem}
}
@media (prefers-reduced-motion: reduce){.links a{transition:none}.links a:hover{transform:none}}

/* ===== Chat ===== */

:root{
  --c-bg1:#efe1fb; --c-bg2:#fbdcec; --c-ink:#3b1d5e; --c-soft:#6a4a8c; --c-bot:#fff; --c-user:#8a3fd1; --c-userink:#fff;
  --c-chip:#fff; --c-chipink:#6b2fb3; --c-chipline:#c9a5ee; --c-head:#fff; --c-ring:#7b3fc4; --c-shadow:rgba(90,40,140,.18); --c-pink:#e6188d;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-bg1:#24103d; --c-bg2:#3a1237; --c-ink:#f6e9ff; --c-soft:#d3b8ee; --c-bot:#3a2358; --c-user:#a45be8; --c-userink:#fff;
  --c-chip:#2d1a47; --c-chipink:#f0d4ff; --c-chipline:#7a4cb0; --c-head:#2d1a47; --c-ring:#f0a6d6; --c-shadow:rgba(0,0,0,.4); --c-pink:#ff8ccb; color-scheme:dark}}
:root[data-theme="dark"]{
  --c-bg1:#24103d; --c-bg2:#3a1237; --c-ink:#f6e9ff; --c-soft:#d3b8ee; --c-bot:#3a2358; --c-user:#a45be8; --c-userink:#fff;
  --c-chip:#2d1a47; --c-chipink:#f0d4ff; --c-chipline:#7a4cb0; --c-head:#2d1a47; --c-ring:#f0a6d6; --c-shadow:rgba(0,0,0,.4); --c-pink:#ff8ccb; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
.app{width:100%; max-width:560px; height:100%; display:flex; flex-direction:column; padding:0 0 0}
#chat header{display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--c-head); box-shadow:0 4px 16px var(--c-shadow); flex:none}
#chat header img{width:48px; height:48px; border-radius:50%; flex:none}
#chat header b{display:block; font-family:"Baloo 2","Nunito",sans-serif; font-size:1.05rem; line-height:1.15}
#chat header span{font-size:.82rem; color:var(--c-soft); display:flex; align-items:center; gap:6px}
#chat header span::before{content:""; width:8px; height:8px; border-radius:50%; background:#2bb673}
#log{flex:1; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth}
.msg{max-width:86%; padding:10px 14px; border-radius:20px; line-height:1.45; font-size:1rem; box-shadow:0 2px 8px var(--c-shadow); overflow-wrap:anywhere}
.msg.bot{align-self:flex-start; background:var(--c-bot); border-bottom-left-radius:6px}
.msg.me{align-self:flex-end; background:var(--c-user); color:var(--c-userink); border-bottom-right-radius:6px}
.msg a{color:var(--c-pink); font-weight:700}
.dots{display:inline-flex; gap:4px; padding:4px 0}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--c-soft); animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.opts{align-self:flex-start; display:flex; flex-direction:column; gap:8px; width:min(86%,380px)}
.opts button{font:inherit; font-weight:700; text-align:left; padding:11px 16px; border-radius:999px; cursor:pointer;
  background:var(--c-chip); color:var(--c-chipink); border:2px solid var(--c-chipline); min-height:46px}
.opts button:hover{border-color:var(--c-ring)}
.opts button:focus-visible,#f input:focus-visible,#f button:focus-visible{outline:3px solid var(--c-ring); outline-offset:2px}
#f{display:flex; gap:8px; padding:10px 14px 14px; background:var(--c-head); flex:none; box-shadow:0 -4px 16px var(--c-shadow)}
#f input{flex:1; min-width:0; font:inherit; font-size:16px; padding:11px 16px; border-radius:999px; border:2px solid var(--c-chipline); background:var(--c-chip); color:var(--c-ink)}
#f button{font:inherit; font-weight:700; border:0; border-radius:999px; padding:0 20px; background:var(--c-user); color:#fff; cursor:pointer; min-height:46px}
@media (prefers-reduced-motion: reduce){#log{scroll-behavior:auto}.dots i{animation:none;opacity:.7}}
@media (max-width:380px){#chat header b{font-size:.95rem}.msg{max-width:92%;font-size:.95rem}.opts{width:94%}}


#chat{display:none; position:fixed; inset:0; z-index:10; justify-content:center; color:var(--c-ink);
  font-family:"Nunito","Trebuchet MS",system-ui,sans-serif; background:linear-gradient(160deg,var(--c-bg1),var(--c-bg2));
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body.chat-open #chat{display:flex}
body.chat-open #home{display:none}
.back{flex:none; width:44px; height:44px; margin-left:-8px; border:0; border-radius:50%; background:transparent; color:var(--c-ink); display:grid; place-items:center; cursor:pointer}
.back svg{width:26px; height:26px; fill:currentColor}
.back:focus-visible{outline:3px solid var(--c-ring)}

</style>
</head>

<div id="chat">
<div class="app">
  <header><button type="button" class="back" id="back" aria-label="Voltar para os links"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button><img id="clogo" alt="Logotipo da APMIF João e Maria"><div><b>APMIF João e Maria</b><span>Atendimento automático</span></div></header>
  <div id="log" role="log" aria-live="polite"></div>
  <form id="f" autocomplete="off"><input id="t" inputmode="numeric" placeholder="Digite o número da opção" aria-label="Sua mensagem"><button>Enviar</button></form>
</div>
</div>
<script>

// Informações a preencher pela diretoria (deixe vazio para omitir a frase):
const CONFIG = { dataBazarPraca: "XX/XX", numFormigarras: "20" };

const FONE = '<a href="tel:+554230255880">(42) 3025-5880</a>';
const SEDE = '<a href="https://maps.app.goo.gl/QAPAcDjbKJoJNxzS8" target="_blank" rel="noopener">Rua Sete de Setembro, 515, centro</a>';
const SAIBA = `Para mais informações ligue ${FONE} ou nos visite na sede (${SEDE}).`;
const log = document.getElementById('log'), input = document.getElementById('t');
let opts = [], busy = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const down = () => { log.scrollTop = log.scrollHeight; };

function add(cls, html){ const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; log.appendChild(d); down(); return d; }
async function bot(...texts){
  busy = true;
  for (const t of texts){
    const d = add('bot', '<span class="dots"><i></i><i></i><i></i></span>');
    await sleep(650); d.innerHTML = t; down();
  }
  busy = false;
}
function show(list){
  opts = list;
  const box = document.createElement('div'); box.className = 'opts';
  list.forEach((o, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = o.label;
    b.onclick = () => pick(i, box); box.appendChild(b); });
  log.appendChild(box); down();
}
function pick(i, box){
  if (busy || !opts[i]) return;
  const o = opts[i]; opts = [];
  (box || log.querySelector('.opts:last-of-type'))?.remove();
  add('me', o.label.replace(/^\d - /, ''));
  o.go();
}

const fim = [{label:'Voltar ao menu', go:menu}, {label:'Encerrar e avaliar o atendimento', go:avaliar}];
async function depois(){ await bot('Posso ajudar com mais alguma coisa?'); show(fim); }

async function menu(){
  await bot('Olá! Eu sou a Formigarra Virtual, atendente virtual da Associação de Proteção à Maternidade, Infância e Família João e Maria. Como posso lhe ajudar hoje?');
  show([
    {label:'1 - Informações sobre os cursos', go:cursos},
    {label:'2 - Informações sobre o bazar', go:bazar},
    {label:'3 - Informações sobre a instituição', go:instituicao},
    {label:'4 - Informações sobre voluntariado', go:voluntariado},
    {label:'5 - Informações sobre doações', go:doacoes}
  ]);
}
async function cursos(){
  await bot('Sobre qual curso você quer saber mais?');
  show([
    {label:'1 - Curso de costura', go:costura},
    {label:'2 - Curso de cabeleireira', go:cabeleireira},
    {label:'3 - Curso de manicure e pedicure', go:manicure},
    {label:'4 - Voltar ao menu', go:menu}
  ]);
}
async function costura(){
  await bot('Nossos cursos de costura acontecem em duas turmas nas terças e quintas-feiras, das 13:30 às 17h. As mensalidades dos cursos são gratuitas, cobramos apenas uma taxa de inscrição simbólica. Atualmente este curso está com lista de espera, com previsão de abertura de vagas em janeiro/2027.', SAIBA);
  depois();
}
async function cabeleireira(){
  await bot('Nossos cursos de cabeleireira acontecem nas terças-feiras, das 13:30h às 17h. As mensalidades dos cursos são gratuitas, cobramos apenas uma taxa de inscrição simbólica. Inscrições abertas!', SAIBA);
  depois();
}
async function manicure(){
  await bot('Nossos cursos de manicure e pedicure acontecem nas quartas-feiras, das 13:30 às 17h. As mensalidades dos cursos são gratuitas, cobramos apenas uma taxa de inscrição simbólica. Inscrições abertas!', SAIBA);
  depois();
}
async function bazar(){
  const m = ['Mantemos um bazar permanente na nossa sede, ' + SEDE + '. Sinta-se à vontade para nos visitar, estamos abertos todas as tardes, de segunda a quinta-feira!'];
  if (CONFIG.dataBazarPraca) m.push(`Além disso, estamos com a data marcada para realizar o bazar na praça, no dia ${CONFIG.dataBazarPraca}. Te esperamos lá!`);
  await bot(...m);
  depois();
}
async function instituicao(){
  await bot('A APMIF João e Maria atua desde 1967 com o objetivo de ajudar quem mais precisa e quem mais é excluído na sociedade. Atualmente, atuamos com cursos profissionalizantes, bazares de baixo custo e doações diversas, como itens de higiene, enxovais para bebês e roupas. Tudo isso é possível porque contamos com uma ótima equipe de formigarras (nossas voluntárias)!', SAIBA);
  depois();
}
async function voluntariado(){
  const eq = CONFIG.numFormigarras ? `Atualmente contamos com uma equipe de ${CONFIG.numFormigarras} formigarras` : 'Contamos com uma equipe de formigarras';
  await bot(eq + ', que nos ajudam na confecção de produtos, instrução de aulas, vendas, administração e muito mais. Venha trabalhar conosco!', SAIBA);
  depois();
}
async function doacoes(){
  await bot('Na nossa sede temos kits de enxovais de bebê para doação (mediante apresentação da carteira de gestante e registro no CadÚnico), incluindo roupas, fraldas, lenços umedecidos, etc.');
  depois();
}
async function avaliar(){
  await bot('Avalie este atendimento:');
  const fin = async () => { await bot('Agradeço sua avaliação e espero ter ajudado. Até mais!'); show([{label:'Novo atendimento', go:menu}]); };
  show([
    {label:'1 - Não gostei', go:fin}, {label:'2 - Indiferente', go:fin},
    {label:'3 - Gostei', go:fin}, {label:'4 - Gostei muito', go:fin}
  ]);
}

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const v = input.value.trim(); input.value = '';
  if (!v || busy) return;
  const n = /^[1-9]$/.test(v) ? Number(v) - 1 : -1;
  if (opts[n]) { pick(n, log.querySelector('.opts:last-of-type')); return; }
  add('me', v.replace(/[<>&]/g, ''));
  bot('Desculpe, não entendi. Toque em uma das opções acima ou digite o número dela.').then(down);
});

// Navegação entre a página de links e o chat (#atendimento)
document.getElementById('clogo').src = document.querySelector('.logo img').src;
let started = false, fromHome = false;
function route(e){
  const open = location.hash === '#atendimento';
  document.body.classList.toggle('chat-open', open);
  if (open){ if (e) fromHome = true; if (!started){ started = true; menu(); } else down(); }
  else window.scrollTo(0,0);
}
document.getElementById('back').addEventListener('click', () => { fromHome ? history.back() : (location.hash = ''); fromHome = false; });
window.addEventListener('hashchange', route);
route();

</script>
